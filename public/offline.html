<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت | مدارس النيل الخاصة</title>
  <style>
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background-color: #F4F6F8;
      color: #1F2933;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(31, 78, 140, 0.08);
      max-width: 400px;
      width: 100%;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      color: #1F4E8C;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      color: #163A6B;
    }
    p {
      font-size: 14px;
      color: #6B7785;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn {
      background: #1F4E8C;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #163A6B;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصال الإنترنت قد انقطع. يمكنك متابعة العمل على البيانات المحفوظة محلياً أو رصد الحضور ليتم مزامنته تلقائياً فور عودة الاتصال.</p>
    <button class="btn" onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
